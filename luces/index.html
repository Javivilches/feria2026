<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <meta name="theme-color" content="#14a858">

  <title>Espectáculo de luces | Peña La Feria</title>

  <style>
    :root {
      --verde-fondo: #15a858;
      --verde-claro: #39cb78;
      --verde-oscuro: #08723b;
      --rojo: #e3362a;
      --rojo-oscuro: #a51f18;
      --amarillo: #f6b300;
      --negro: #080808;
      --blanco: #ffffff;
      --crema: #fff8e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--verde-fondo);
      color: var(--blanco);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    #pantalla {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      overflow: hidden;
      background-color: var(--verde-fondo);
      transition: background-color 0.12s linear;
    }

    /* Fondo verde con lunares de feria */
    #pantalla::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--verde-fondo);
      background-image:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.22) 0 8px,
          transparent 9px
        ),
        radial-gradient(
          circle,
          rgba(227, 54, 42, 0.18) 0 5px,
          transparent 6px
        ),
        linear-gradient(
          145deg,
          rgba(57, 203, 120, 0.5),
          rgba(8, 114, 59, 0.55)
        );
      background-size:
        68px 68px,
        68px 68px,
        100% 100%;
      background-position:
        0 0,
        34px 34px,
        0 0;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    #pantalla.modo-espectaculo::before {
      opacity: 0;
    }

    #inicio {
      position: relative;
      z-index: 2;
      width: min(100%, 430px);
      padding: 31px 24px 28px;
      text-align: center;
      background: rgba(5, 35, 21, 0.87);
      border: 3px solid var(--rojo);
      border-radius: 28px;
      box-shadow:
        0 0 0 5px rgba(255, 255, 255, 0.13),
        0 18px 55px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    #emblema {
      width: 145px;
      height: 145px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #emblema img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.4));
    }

    #nombre {
      margin-bottom: 8px;
      color: var(--blanco);
      font-size: clamp(29px, 8vw, 38px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #nombre span {
      color: var(--verde-claro);
    }

    #subtitulo {
      margin-bottom: 22px;
      color: var(--crema);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #instrucciones {
      margin-bottom: 24px;
      padding: 16px 17px;
      color: var(--blanco);
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 15px;
      box-shadow:
        inset 0 0 0 3px rgba(255, 255, 255, 0.04),
        0 5px 16px rgba(0, 0, 0, 0.18);
    }

    #botonEntrar {
      width: 112px;
      height: 112px;
      padding: 0;
      border: 4px solid var(--blanco);
      border-radius: 50%;
      background: var(--rojo);
      color: var(--blanco);
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow:
        0 8px 0 var(--rojo-oscuro),
        0 12px 23px rgba(0, 0, 0, 0.35);
      transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;
    }

    #botonEntrar:active {
      transform: translateY(6px);
      box-shadow:
        0 2px 0 var(--rojo-oscuro),
        0 5px 12px rgba(0, 0, 0, 0.3);
    }

    #botonEntrar:disabled {
      opacity: 0.75;
      cursor: default;
    }

    #estado {
      min-height: 22px;
      margin-top: 23px;
      color: #e3ffec;
      font-size: 14px;
      font-weight: 700;
    }

    #indicador {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--amarillo);
      box-shadow: 0 0 9px var(--amarillo);
    }

    #mensajeEspectaculo {
      position: relative;
      z-index: 3;
      display: none;
      width: 100%;
      padding: 25px;
      color: var(--blanco);
      text-align: center;
      font-size: clamp(35px, 11vw, 80px);
      line-height: 1.05;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow:
        0 3px 3px rgba(0, 0, 0, 0.8),
        0 0 18px rgba(0, 0, 0, 0.65);
    }

    .oculto {
      display: none !important;
    }

    @media (max-height: 720px) {
      #inicio {
        padding-top: 19px;
        padding-bottom: 20px;
      }

      #emblema {
        width: 100px;
        height: 100px;
        margin-bottom: 13px;
      }

      #subtitulo {
        margin-bottom: 14px;
      }

      #instrucciones {
        margin-bottom: 16px;
        padding: 11px 13px;
        font-size: 14px;
      }

      #botonEntrar {
        width: 92px;
        height: 92px;
        font-size: 17px;
      }

      #estado {
        margin-top: 17px;
      }
    }
  </style>
</head>

<body>

  <main id="pantalla">

    <section id="inicio">

      <div id="emblema">
        <img src="./logo.png" alt="Logo de Peña La Feria">
      </div>

      <h1 id="nombre">
        Peña <span>La Feria</span>
      </h1>

      <p id="subtitulo">
        Espectáculo luminoso
      </p>

      <div id="instrucciones">
        Pulsa el botón, sube el brillo de la pantalla al máximo
        y mantén esta página abierta durante el espectáculo.
      </div>

      <button id="botonEntrar" type="button">
        Entrar
      </button>

      <div id="estado">
        <span id="indicador"></span>
        Preparado para conectar
      </div>

    </section>

    <div id="mensajeEspectaculo"></div>

  </main>

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    /*
      Cuando creemos Firebase sustituiremos estos datos.
    */

    const firebaseConfig = {
  apiKey: "AIzaSyBGE07hyoxTRor5PrdxLcFBrtq70xBxNOw",
  authDomain: "pena-la-feria-luces.firebaseapp.com",
  databaseURL: "https://pena-la-feria-luces-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "pena-la-feria-luces",
  storageBucket: "pena-la-feria-luces.firebasestorage.app",
  messagingSenderId: "404658683183",
  appId: "1:404658683183:web:0c81e55c3a6cd99d3135da"
};


    const pantalla =
      document.getElementById("pantalla");

    const inicio =
      document.getElementById("inicio");

    const botonEntrar =
      document.getElementById("botonEntrar");

    const estado =
      document.getElementById("estado");

    const indicador =
      document.getElementById("indicador");

    const mensajeEspectaculo =
      document.getElementById("mensajeEspectaculo");


    let firebaseIniciado = false;
    let wakeLock = null;


    function actualizarEstado(texto, color) {
      estado.lastChild.textContent = " " + texto;
      indicador.style.backgroundColor = color;
      indicador.style.boxShadow = `0 0 9px ${color}`;
    }


    function cambiarPantalla(datos) {
      if (!datos) {
        return;
      }

      const color =
        typeof datos.color === "string"
          ? datos.color
          : "#000000";

      const mensaje =
        typeof datos.mensaje === "string"
          ? datos.mensaje
          : "";

      pantalla.classList.add("modo-espectaculo");
      pantalla.style.backgroundColor = color;
      document.body.style.backgroundColor = color;

      if (mensaje.trim() !== "") {
        mensajeEspectaculo.textContent = mensaje;
        mensajeEspectaculo.style.display = "block";
      } else {
        mensajeEspectaculo.textContent = "";
        mensajeEspectaculo.style.display = "none";
      }
    }


    async function activarPantallaCompleta() {
      try {
        const elemento = document.documentElement;

        if (elemento.requestFullscreen) {
          await elemento.requestFullscreen();
        } else if (elemento.webkitRequestFullscreen) {
          await elemento.webkitRequestFullscreen();
        }
      } catch (error) {
        console.log(
          "No se pudo activar la pantalla completa:",
          error
        );
      }
    }


    async function mantenerPantallaEncendida() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock =
            await navigator.wakeLock.request("screen");

          wakeLock.addEventListener("release", () => {
            wakeLock = null;
          });
        }
      } catch (error) {
        wakeLock = null;

        console.log(
          "No se pudo mantener la pantalla encendida:",
          error
        );
      }
    }


    function conectarFirebase() {
      if (firebaseIniciado) {
        return;
      }

      firebaseIniciado = true;

      actualizarEstado(
        "Conectando...",
        "#f6b300"
      );

      try {
        const app =
          initializeApp(firebaseConfig);

        const database =
          getDatabase(app);

        const referenciaEspectaculo =
          ref(database, "espectaculo");

        onValue(
          referenciaEspectaculo,

          (snapshot) => {
            actualizarEstado(
              "Conectado. Esperando el inicio...",
              "#39cb78"
            );

            cambiarPantalla(snapshot.val());
          },

          (error) => {
            firebaseIniciado = false;

            actualizarEstado(
              "No se ha podido conectar",
              "#e3362a"
            );

            console.error(
              "Error de Firebase:",
              error
            );
          }
        );
      } catch (error) {
        firebaseIniciado = false;

        actualizarEstado(
          "Firebase todavía no está configurado",
          "#e3362a"
        );

        console.error(error);
      }
    }


    botonEntrar.addEventListener(
      "click",

      async () => {
        botonEntrar.disabled = true;
        botonEntrar.textContent = "...";

        await activarPantallaCompleta();
        await mantenerPantallaEncendida();

        conectarFirebase();

        setTimeout(() => {
          inicio.classList.add("oculto");
          pantalla.classList.add("modo-espectaculo");
          pantalla.style.backgroundColor = "#000000";
        }, 450);
      }
    );


    document.addEventListener(
      "visibilitychange",

      async () => {
        if (
          document.visibilityState === "visible" &&
          wakeLock === null
        ) {
          await mantenerPantallaEncendida();
        }
      }
    );

  </script>

</body>
</html>
