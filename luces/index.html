<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <meta name="theme-color" content="#14a858">

  <title>Espectáculo de luces | Peña La Feria</title>

  <style>
    :root {
      --verde-fondo: #15a858;
      --verde-claro: #39cb78;
      --verde-oscuro: #08723b;
      --rojo: #e3362a;
      --rojo-oscuro: #a51f18;
      --amarillo: #f6b300;
      --negro: #080808;
      --blanco: #ffffff;
      --crema: #fff8e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--verde-fondo);
      color: var(--blanco);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    #pantalla {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      overflow: hidden;
      background-color: var(--verde-fondo);
      transition: background-color 0.12s linear;
    }

    /* Fondo verde con lunares de feria */
    #pantalla::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--verde-fondo);
      background-image:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.22) 0 8px,
          transparent 9px
        ),
        radial-gradient(
          circle,
          rgba(227, 54, 42, 0.18) 0 5px,
          transparent 6px
        ),
        linear-gradient(
          145deg,
          rgba(57, 203, 120, 0.5),
          rgba(8, 114, 59, 0.55)
        );
      background-size:
        68px 68px,
        68px 68px,
        100% 100%;
      background-position:
        0 0,
        34px 34px,
        0 0;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    #pantalla.modo-espectaculo::before {
      opacity: 0;
    }

    #inicio {
      position: relative;
      z-index: 2;
      width: min(100%, 430px);
      padding: 31px 24px 28px;
      text-align: center;
      background: rgba(5, 35, 21, 0.87);
      border: 3px solid var(--rojo);
      border-radius: 28px;
      box-shadow:
        0 0 0 5px rgba(255, 255, 255, 0.13),
        0 18px 55px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    #emblema {
      width: 145px;
      height: 145px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #emblema img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.4));
    }

    #nombre {
      margin-bottom: 8px;
      color: var(--blanco);
      font-size: clamp(29px, 8vw, 38px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #nombre span {
      color: var(--verde-claro);
    }

    #subtitulo {
      margin-bottom: 22px;
      color: var(--crema);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #instrucciones {
      margin-bottom: 24px;
      padding: 16px 17px;
      color: var(--blanco);
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 15px;
      box-shadow:
        inset 0 0 0 3px rgba(255, 255, 255, 0.04),
        0 5px 16px rgba(0, 0, 0, 0.18);
    }

    #botonEntrar {
      width: 112px;
      height: 112px;
      padding: 0;
      border: 4px solid var(--blanco);
      border-radius: 50%;
      background: var(--rojo);
      color: var(--blanco);
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow:
        0 8px 0 var(--rojo-oscuro),
        0 12px 23px rgba(0, 0, 0, 0.35);
      transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;
    }

    #botonEntrar:active {
      transform: translateY(6px);
      box-shadow:
        0 2px 0 var(--rojo-oscuro),
        0 5px 12px rgba(0, 0, 0, 0.3);
    }

    #botonEntrar:disabled {
      opacity: 0.75;
      cursor: default;
    }

    #estado {
      min-height: 22px;
      margin-top: 23px;
      color: #e3ffec;
      font-size: 14px;
      font-weight: 700;
    }

    #indicador {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--amarillo);
      box-shadow: 0 0 9px var(--amarillo);
    }


    #feriantito {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: 0;
      display: none;
      width: min(94vw, 560px);
      max-height: 92vh;
      height: auto;
      object-fit: contain;
      transform: translateX(-50%);
      pointer-events: none;
      background: transparent;
      filter:
        drop-shadow(0 8px 14px rgba(0, 0, 0, 0.38))
        drop-shadow(0 0 12px rgba(255, 255, 255, 0.16));
    }

    #pantalla.modo-espectaculo #feriantito {
      display: block;
    }

    #mensajeEspectaculo {
      position: fixed;
      z-index: 4;
      top: 5vh;
      left: 0;
      display: none;
      width: 100%;
      padding: 25px;
      color: var(--blanco);
      text-align: center;
      font-size: clamp(35px, 11vw, 80px);
      line-height: 1.05;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow:
        0 3px 3px rgba(0, 0, 0, 0.8),
        0 0 18px rgba(0, 0, 0, 0.65);
    }

    .oculto {
      display: none !important;
    }


    @media (max-width: 480px) {
      #feriantito {
        width: 98vw;
        max-height: 88vh;
      }

      #mensajeEspectaculo {
        top: 3vh;
        padding: 16px;
        font-size: clamp(30px, 10vw, 58px);
      }
    }

    @media (max-height: 720px) {
      #inicio {
        padding-top: 19px;
        padding-bottom: 20px;
      }

      #emblema {
        width: 100px;
        height: 100px;
        margin-bottom: 13px;
      }

      #subtitulo {
        margin-bottom: 14px;
      }

      #instrucciones {
        margin-bottom: 16px;
        padding: 11px 13px;
        font-size: 14px;
      }

      #botonEntrar {
        width: 92px;
        height: 92px;
        font-size: 17px;
      }

      #estado {
        margin-top: 17px;
      }
    }
  </style>
</head>

<body>

  <main id="pantalla">

    <section id="inicio">

      <div id="emblema">
        <img src="./logo.png" alt="Logo de Peña La Feria">
      </div>

      <h1 id="nombre">
        Peña <span>La Feria</span>
      </h1>

      <p id="subtitulo">
        Espectáculo luminoso
      </p>

      <div id="instrucciones">
        Pulsa el botón, sube el brillo de la pantalla al máximo
        y mantén esta página abierta durante el espectáculo.
      </div>

      <button id="botonEntrar" type="button">
        Entrar
      </button>

      <div id="estado">
        <span id="indicador"></span>
        Preparado para conectar
      </div>

    </section>


    <video
      id="feriantito"
      muted
      loop
      playsinline
      preload="auto"
      aria-hidden="true"
    >
      <source src="./feriantito.webm" type="video/webm">
      <source src="./feriantito.mp4" type="video/mp4">
    </video>

    <div id="mensajeEspectaculo"></div>

  </main>

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    /*
      Cuando creemos Firebase sustituiremos estos datos.
    */

    const firebaseConfig = {
      apiKey: "AIzaSyBGE07hyoxTRor5PrdxLcFBrtq70xBxNOw",
      authDomain: "pena-la-feria-luces.firebaseapp.com",
      databaseURL: "https://pena-la-feria-luces-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pena-la-feria-luces",
      storageBucket: "pena-la-feria-luces.firebasestorage.app",
      messagingSenderId: "404658683183",
      appId: "1:404658683183:web:0c81e55c3a6cd99d3135da"
    };


    const pantalla =
      document.getElementById("pantalla");

    const inicio =
      document.getElementById("inicio");

    const botonEntrar =
      document.getElementById("botonEntrar");

    const estado =
      document.getElementById("estado");

    const indicador =
      document.getElementById("indicador");

    const mensajeEspectaculo =
      document.getElementById("mensajeEspectaculo");

    const feriantito =
      document.getElementById("feriantito");


    let firebaseIniciado = false;
    let wakeLock = null;
    let desfaseServidor = 0;
    let ultimoComandoId = "";
    let temporizadoresPrograma = [];


    /*
      Golpes detectados en el audio exacto enviado.
      Tempo aproximado: 99,38 BPM.
    */
    const golpesLaBomba = [
      163, 766, 1393, 1997, 2601, 3204, 3808, 4412,
      5016, 5596, 6177, 6780, 7407, 8011, 8591, 9195,
      9799, 10403, 10983, 11587, 12190, 12794, 13398, 14002,
      14605, 15209, 15813, 16695, 17299, 17903, 18506, 19110,
      19691, 20294, 20898, 21502, 22082, 22686, 23290, 23893,
      24497, 25101, 25705, 26308, 26889, 27492, 28096, 28700,
      29280, 29884, 30488, 31092, 31672, 32276, 32880, 33483,
      34064, 34667, 35271, 35875, 36479, 37082, 37686, 38290,
      38870, 39474, 40078, 40681, 41262, 41866, 42470, 43073,
      43677, 44280, 44884, 45488, 46068, 46672, 47276, 47880,
      48460, 49064, 49668, 50294, 50875, 51478, 52082, 52686,
      53267, 53870, 54474, 55078, 55681, 56285, 56889, 57469,
      58073, 58677, 59280, 59884, 60465, 61068, 61672, 62276,
      62880, 63483, 64087, 64691, 65271, 65875, 66479, 67082,
      67686, 68290, 68894, 69474, 70078
    ];


    function crearProgramaLaBomba() {
      const escenas = [
        {
          tiempo: 0,
          color: "#000000",
          mensaje: ""
        }
      ];

      const coloresIntro = [
        "#1565ff",
        "#00d45d",
        "#ff1f12",
        "#ffd400"
      ];

      const coloresBaile = [
        "#ff1f12",
        "#ffd400",
        "#00d45d",
        "#1565ff"
      ];

      golpesLaBomba.forEach((golpe, indice) => {
        let color = "#000000";
        let duracionDestello = 0;

        /*
          Introducción: pulsos espaciados y cortos.
        */
        if (indice < 8) {
          if (indice % 2 !== 0) {
            return;
          }

          color =
            coloresIntro[
              Math.floor(indice / 2) %
              coloresIntro.length
            ];

          duracionDestello = 260;
        }

        /*
          Subida: cada golpe empieza a mover la luz.
        */
        else if (indice < 24) {
          color =
            indice % 4 === 0
              ? "#ffffff"
              : coloresBaile[indice % 4];

          duracionDestello =
            indice % 4 === 0
              ? 210
              : 390;
        }

        /*
          Parte principal: colores sostenidos al compás.
          El primer golpe de cada grupo de cuatro es blanco.
        */
        else if (indice < 80) {
          color =
            indice % 4 === 0
              ? "#ffffff"
              : coloresBaile[
                  Math.floor(indice / 4) %
                  coloresBaile.length
                ];

          duracionDestello =
            indice % 4 === 0
              ? 190
              : 500;
        }

        /*
          Pequeño descanso musical: menos cambios,
          dejando respirar el espectáculo.
        */
        else if (indice < 88) {
          if (indice % 2 !== 0) {
            return;
          }

          color =
            indice % 4 === 0
              ? "#ffffff"
              : "#ff1f12";

          duracionDestello = 300;
        }

        /*
          Tramo final: más energía y cambios en cada golpe.
        */
        else {
          color =
            indice % 4 === 0
              ? "#ffffff"
              : coloresBaile[indice % 4];

          duracionDestello =
            indice % 4 === 0
              ? 210
              : 460;
        }

        escenas.push({
          tiempo: golpe,
          color,
          mensaje: ""
        });

        /*
          Un apagón corto después del golpe crea
          la sensación clara de destello y movimiento.
        */
        escenas.push({
          tiempo: golpe + duracionDestello,
          color: "#000000",
          mensaje: ""
        });
      });

      /*
        Remate final.
      */
      escenas.push(
        {
          tiempo: 67686,
          color: "#ffffff",
          mensaje: ""
        },
        {
          tiempo: 68290,
          color: "#ff1f12",
          mensaje: "¡LA BOMBA!"
        },
        {
          tiempo: 68894,
          color: "#ffd400",
          mensaje: "¡LA BOMBA!"
        },
        {
          tiempo: 69474,
          color: "#00d45d",
          mensaje: "¡LA BOMBA!"
        },
        {
          tiempo: 70078,
          color: "#ffffff",
          mensaje: "¡PEÑA LA FERIA!"
        },
        {
          tiempo: 71400,
          color: "#000000",
          mensaje: ""
        }
      );

      return escenas.sort(
        (a, b) => a.tiempo - b.tiempo
      );
    }


    const programaLaBomba =
      crearProgramaLaBomba();


    function actualizarEstado(texto, color) {
      estado.lastChild.textContent = " " + texto;
      indicador.style.backgroundColor = color;
      indicador.style.boxShadow = `0 0 9px ${color}`;
    }


    function limpiarPrograma() {
      temporizadoresPrograma.forEach(
        (temporizador) => {
          window.clearTimeout(temporizador);
        }
      );

      temporizadoresPrograma = [];
    }


    function mostrarEscena(escena) {
      const color =
        typeof escena.color === "string"
          ? escena.color
          : "#000000";

      const mensaje =
        typeof escena.mensaje === "string"
          ? escena.mensaje
          : "";

      pantalla.classList.add("modo-espectaculo");
      pantalla.style.backgroundColor = color;
      document.body.style.backgroundColor = color;

      if (mensaje.trim() !== "") {
        mensajeEspectaculo.textContent = mensaje;
        mensajeEspectaculo.style.display = "block";
      } else {
        mensajeEspectaculo.textContent = "";
        mensajeEspectaculo.style.display = "none";
      }
    }


    function reproducirPrograma(
      programa,
      horaInicioServidor
    ) {
      limpiarPrograma();

      const ahoraServidor =
        Date.now() + desfaseServidor;

      const tiempoTranscurrido =
        ahoraServidor - horaInicioServidor;

      /*
        Si el móvil recibe la orden un poco tarde,
        se coloca directamente en la escena correcta.
      */
      let escenaActual = {
        color: "#000000",
        mensaje: ""
      };

      programa.forEach((escena) => {
        if (escena.tiempo <= tiempoTranscurrido) {
          escenaActual = escena;
        }
      });

      mostrarEscena(escenaActual);

      programa.forEach((escena) => {
        const espera =
          escena.tiempo - tiempoTranscurrido;

        if (espera > 0) {
          const temporizador =
            window.setTimeout(() => {
              mostrarEscena(escena);
            }, espera);

          temporizadoresPrograma.push(
            temporizador
          );
        }
      });
    }


    function procesarOrden(datos) {
      if (!datos) {
        return;
      }

      const comandoId =
        typeof datos.comandoId === "string"
          ? datos.comandoId
          : "";

      if (
        comandoId !== "" &&
        comandoId === ultimoComandoId
      ) {
        return;
      }

      if (comandoId !== "") {
        ultimoComandoId = comandoId;
      }

      if (
        datos.modo === "programa" &&
        datos.programa === "laBomba" &&
        typeof datos.comandoEn === "number"
      ) {
        const retraso =
          typeof datos.retrasoInicio === "number"
            ? datos.retrasoInicio
            : 4000;

        const horaInicio =
          datos.comandoEn + retraso;

        reproducirPrograma(
          programaLaBomba,
          horaInicio
        );

        return;
      }

      if (datos.modo === "detener") {
        limpiarPrograma();

        mostrarEscena({
          color: "#000000",
          mensaje: ""
        });

        return;
      }

      /*
        Mantiene funcionando los botones manuales
        del panel de administración.
      */
      if (
        datos.modo === "manual" ||
        typeof datos.color === "string"
      ) {
        limpiarPrograma();

        mostrarEscena({
          color:
            typeof datos.color === "string"
              ? datos.color
              : "#000000",

          mensaje:
            typeof datos.mensaje === "string"
              ? datos.mensaje
              : ""
        });
      }
    }



    async function iniciarFeriantito() {
      if (!feriantito) {
        return;
      }

      try {
        feriantito.currentTime = 0;
        await feriantito.play();
      } catch (error) {
        console.log(
          "El vídeo de Feriantito no pudo iniciarse:",
          error
        );
      }
    }


    async function activarPantallaCompleta() {
      try {
        const elemento = document.documentElement;

        if (elemento.requestFullscreen) {
          await elemento.requestFullscreen();
        } else if (elemento.webkitRequestFullscreen) {
          await elemento.webkitRequestFullscreen();
        }
      } catch (error) {
        console.log(
          "No se pudo activar la pantalla completa:",
          error
        );
      }
    }


    async function mantenerPantallaEncendida() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock =
            await navigator.wakeLock.request("screen");

          wakeLock.addEventListener("release", () => {
            wakeLock = null;
          });
        }
      } catch (error) {
        wakeLock = null;

        console.log(
          "No se pudo mantener la pantalla encendida:",
          error
        );
      }
    }


    function conectarFirebase() {
      if (firebaseIniciado) {
        return;
      }

      firebaseIniciado = true;

      actualizarEstado(
        "Conectando...",
        "#f6b300"
      );

      try {
        const app =
          initializeApp(firebaseConfig);

        const database =
          getDatabase(app);

        const referenciaDesfase =
          ref(database, ".info/serverTimeOffset");

        const referenciaEspectaculo =
          ref(database, "espectaculo");

        onValue(
          referenciaDesfase,
          (snapshot) => {
            desfaseServidor =
              typeof snapshot.val() === "number"
                ? snapshot.val()
                : 0;
          }
        );

        onValue(
          referenciaEspectaculo,

          (snapshot) => {
            actualizarEstado(
              "Conectado. Esperando el inicio...",
              "#39cb78"
            );

            procesarOrden(snapshot.val());
          },

          (error) => {
            firebaseIniciado = false;

            actualizarEstado(
              "No se ha podido conectar",
              "#e3362a"
            );

            console.error(
              "Error de Firebase:",
              error
            );
          }
        );
      } catch (error) {
        firebaseIniciado = false;

        actualizarEstado(
          "No se ha podido conectar",
          "#e3362a"
        );

        console.error(error);
      }
    }


    botonEntrar.addEventListener(
      "click",

      async () => {
        botonEntrar.disabled = true;
        botonEntrar.textContent = "...";

        await activarPantallaCompleta();
        await mantenerPantallaEncendida();
        await iniciarFeriantito();

        conectarFirebase();

        setTimeout(() => {
          inicio.classList.add("oculto");
          pantalla.classList.add("modo-espectaculo");
          pantalla.style.backgroundColor = "#000000";
        }, 450);
      }
    );


    document.addEventListener(
      "visibilitychange",

      async () => {
        if (
          document.visibilityState === "visible" &&
          wakeLock === null
        ) {
          await mantenerPantallaEncendida();

          if (
            feriantito &&
            feriantito.paused
          ) {
            try {
              await feriantito.play();
            } catch (error) {
              console.log(
                "No se pudo reanudar Feriantito:",
                error
              );
            }
          }
        }
      }
    );

  </script>

</body>
</html>
