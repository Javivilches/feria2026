<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Peticiones pausadas | Peña La Feria</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            /* Fondo exterior similar al de la imagen */
            background-color: #f9df62;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cartel {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background-color: #f9df62;
        }

        .cartel img {
            display: block;

            /*
             * La imagen siempre se muestra ENTERA.
             * Nunca obliga a hacer scroll.
             */
            width: auto;
            height: 100%;

            max-width: 100%;
            max-height: 100%;

            object-fit: contain;
        }

    </style>
</head>

<body>

    <main class="cartel">

        <img
            src="pausadas.png"
            alt="Peticiones de canciones pausadas - Peña La Feria"
        >

    </main>

</body>

</html>
