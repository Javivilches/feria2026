<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Pide tu canción | Peña La Feria</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #087a3d;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================
   CONTENEDOR
   ========================================= */

.cartel {

    /*
       Estas proporciones deben coincidir
       aproximadamente con pide.png.
       
       Si tu imagen es vertical tipo cartel,
       2 / 3 suele funcionar bien.
    */

    position: relative;

    height: 100vh;
    height: 100dvh;

    max-width: 100vw;

    aspect-ratio: 2 / 3;

    background-image: url("pide.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;

}


/* =========================================
   BOTÓN SUPERPUESTO
   ========================================= */

/*

IMPORTANTE:

Estas cuatro variables permiten colocar
el botón exactamente encima del botón
dibujado en pide.png.

Son porcentajes respecto a la imagen.

*/

:root {

    /* posición vertical */
    --boton-top: 67%;

    /* posición horizontal */
    --boton-left: 11%;

    /* anchura */
    --boton-width: 78%;

    /* altura */
    --boton-height: 9%;

}


.boton-peticion {

    position: absolute;

    top: var(--boton-top);
    left: var(--boton-left);

    width: var(--boton-width);
    height: var(--boton-height);

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;

    /*
       El fondo queda transparente porque
       el botón bonito ya está dibujado
       dentro de pide.png.
    */

    background: transparent;

    border: 0;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

}


/* =========================================
   TEXTO DEL BOTÓN
   ========================================= */

.texto-boton {

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-size: clamp(
        20px,
        4.5vh,
        42px
    );

    font-weight: 900;

    letter-spacing: 1px;

    white-space: nowrap;

    color: #fff7dc;

    /*
       Animación bastante visible
    */

    animation:
        luminoso 0.75s
        infinite
        alternate
        ease-in-out;

}


/* =========================================
   PARPADEO / LUMINOSO
   ========================================= */

@keyframes luminoso {

    0% {

        color: #ffffff;

        transform: scale(1);

        text-shadow:
            2px 2px 0 #8e1015;

    }


    100% {

        color: #ffe600;

        transform: scale(1.06);

        text-shadow:

            0 0 5px #ffffff,

            0 0 10px #ffe600,

            0 0 18px #ffe600,

            0 0 28px #ff9d00,

            2px 2px 0 #8e1015;

    }

}


/* =========================================
   EFECTO AL TOCAR
   ========================================= */

.boton-peticion:active .texto-boton {

    transform: scale(0.94);

}


/* =========================================
   PANTALLAS MUY ESTRECHAS
   ========================================= */

@media (max-width: 400px) {

    .texto-boton {

        font-size: clamp(
            18px,
            4vh,
            32px
        );

    }

}


/* =========================================
   MÓVILES EN HORIZONTAL
   ========================================= */

@media (orientation: landscape) {

    .cartel {

        height: 100vh;
        height: 100dvh;

    }

}

</style>
</head>


<body>


<div class="cartel">


    <a
        class="boton-peticion"

        href="https://rekwest.app/qr/c3389356-bab1-475f-a781-38c8469c9a22"

        aria-label="Pedir mi canción"
    >

        <span class="texto-boton">
            PEDIR MI CANCIÓN
        </span>

    </a>


</div>


</body>
</html>
