<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Pide tu canción | Peña La Feria</title>

<style>

/* =========================================
   RESETEO GENERAL
   ========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    /*
       Mismo tono aproximado que el fondo
       amarillo del cartel.
    */
    background: #f9df62;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================
   CARTEL / IMAGEN
   ========================================= */

.cartel {
    position: relative;

    /*
       Ocupa toda la altura disponible,
       pero nunca supera el ancho de pantalla.
    */
    height: 100vh;
    height: 100dvh;

    max-width: 100vw;

    aspect-ratio: 2 / 3;

    /*
       Por si queda algún mínimo espacio
       alrededor de la imagen.
    */
    background-color: #f9df62;

    background-image: url("pide.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: contain;

    overflow: hidden;
}


/* =========================================
   AJUSTES DEL BOTÓN
   ========================================= */

:root {

    /*
       POSICIÓN VERTICAL
    */
    --boton-top: 62.5%;

    /*
       ANCHO
    */
    --boton-width: 78%;

    /*
       ALTURA
    */
    --boton-height: 7.5%;

}


/* =========================================
   BOTÓN
   ========================================= */

.boton-peticion {

    position: absolute;

    /*
       Lo centramos matemáticamente.
       Así no puede desplazarse hacia
       izquierda o derecha.
    */

    left: 50%;
    top: var(--boton-top);

    transform: translateX(-50%);

    width: var(--boton-width);
    height: var(--boton-height);


    display: flex;
    align-items: center;
    justify-content: center;


    text-decoration: none;


    /*
       ROJO DEL BOTÓN
    */

    background:
        linear-gradient(
            180deg,
            #ef1717 0%,
            #df0b14 55%,
            #c9000b 100%
        );


    /*
       BORDE VERDE
    */

    border: 4px solid #079b49;


    /*
       BORDE NEGRO EXTERIOR
    */

    outline: 3px solid #111;
    outline-offset: 2px;


    border-radius: 14px;


    /*
       LIGERO VOLUMEN
    */

    box-shadow:

        inset 0 0 0 2px
        rgba(255,255,255,.20),

        0 4px 0
        rgba(0,0,0,.25);


    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

}


/* =========================================
   BORDE AMARILLO INTERIOR
   ========================================= */

.boton-peticion::before {

    content: "";

    position: absolute;

    top: 5px;
    right: 5px;
    bottom: 5px;
    left: 5px;

    border: 2px solid #f5dc57;

    border-radius: 8px;

    pointer-events: none;

}


/* =========================================
   TEXTO DEL BOTÓN
   ========================================= */

.texto-boton {

    position: relative;

    z-index: 2;


    font-family:
        Impact,
        "Arial Black",
        sans-serif;


    font-size: clamp(
        18px,
        3.8vh,
        36px
    );


    font-weight: 900;

    letter-spacing: 1.4px;

    white-space: nowrap;


    /*
       Estado inicial
    */

    color: #ffffff;


    /*
       ANIMACIÓN

       Incluyo también -webkit-
       para mejorar compatibilidad
       con móviles.
    */

    -webkit-animation:
        luminoso 0.65s
        infinite
        alternate
        ease-in-out;

    animation:
        luminoso 0.65s
        infinite
        alternate
        ease-in-out;

}


/* =========================================
   ANIMACIÓN WEBKIT
   ========================================= */

@-webkit-keyframes luminoso {

    0% {

        color: #ffffff;

        -webkit-transform: scale(1);
        transform: scale(1);

        text-shadow:
            2px 2px 0 #790000;

    }


    100% {

        color: #ffe600;

        -webkit-transform: scale(1.07);
        transform: scale(1.07);

        text-shadow:

            0 0 4px #ffffff,

            0 0 9px #fff200,

            0 0 16px #ffe000,

            0 0 25px #ff9d00,

            2px 2px 0 #790000;

    }

}


/* =========================================
   ANIMACIÓN ESTÁNDAR
   ========================================= */

@keyframes luminoso {

    0% {

        color: #ffffff;

        transform: scale(1);

        text-shadow:
            2px 2px 0 #790000;

    }


    100% {

        color: #ffe600;

        transform: scale(1.07);

        text-shadow:

            0 0 4px #ffffff,

            0 0 9px #fff200,

            0 0 16px #ffe000,

            0 0 25px #ff9d00,

            2px 2px 0 #790000;

    }

}


/* =========================================
   EFECTO AL PULSAR
   ========================================= */

.boton-peticion:active {

    /*
       IMPORTANTE:
       mantenemos translateX(-50%)
       para no perder el centrado.
    */

    transform:
        translateX(-50%)
        scale(.97);

}


/* =========================================
   MÓVILES PEQUEÑOS
   ========================================= */

@media (max-width: 400px) {

    .boton-peticion {

        border-width: 3px;

        outline-width: 2px;

    }


    .boton-peticion::before {

        top: 4px;
        right: 4px;
        bottom: 4px;
        left: 4px;

        border-width: 1.5px;

    }


    .texto-boton {

        font-size: clamp(
            17px,
            3.5vh,
            29px
        );

    }

}


/* =========================================
   MÓVIL EN HORIZONTAL
   ========================================= */

@media (orientation: landscape) {

    .cartel {

        height: 100vh;
        height: 100dvh;

        max-width: 100vw;

    }

}

</style>
</head>


<body>


<main class="cartel">


    <a
        class="boton-peticion"

        href="https://rekwest.app/qr/c3389356-bab1-475f-a781-38c8469c9a22"

        aria-label="Pedir mi canción"
    >

        <span class="texto-boton">
            PEDIR MI CANCIÓN
        </span>

    </a>


</main>


</body>
</html>
