<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Pide tu canción | Peña La Feria</title>

<style>

/* ==============================
   RESETEO
   ============================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #087a3d;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, Helvetica, sans-serif;
}


/* ==============================
   CARTEL
   ============================== */

.cartel {

    position: relative;

    /*
       El cartel siempre cabe entero
       en la pantalla.
    */

    height: 100vh;
    height: 100dvh;

    max-width: 100vw;

    aspect-ratio: 2 / 3;

    background-image: url("pide.png");

    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;

}


/* ==============================
   POSICIÓN DEL BOTÓN

   Si posteriormente quieres moverlo,
   solo hay que tocar estos valores.
   ============================== */

:root {

    /* Más arriba que antes */
    --boton-top: 64.5%;

    /* Más estrecho */
    --boton-left: 16%;
    --boton-width: 68%;

    --boton-height: 7.5%;

}


/* ==============================
   BOTÓN
   ============================== */

.boton-peticion {

    position: absolute;

    top: var(--boton-top);
    left: var(--boton-left);

    width: var(--boton-width);
    height: var(--boton-height);

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;

    /*
       Fondo rojo vivo
    */

    background:
        linear-gradient(
            180deg,
            #ef1717 0%,
            #df0b14 55%,
            #c9000b 100%
        );

    /*
       Primer borde verde
    */

    border: 4px solid #079b49;

    /*
       Segundo borde negro
    */

    outline: 3px solid #111;
    outline-offset: 2px;

    border-radius: 14px;

    /*
       Algo de volumen sin pasarnos
    */

    box-shadow:

        inset 0 0 0 2px
        rgba(255,255,255,.20),

        0 4px 0
        rgba(0,0,0,.25);

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

}


/* ==============================
   LÍNEA INTERIOR AMARILLA
   ============================== */

.boton-peticion::before {

    content: "";

    position: absolute;

    top: 5px;
    right: 5px;
    bottom: 5px;
    left: 5px;

    border: 2px solid #f5dc57;

    border-radius: 8px;

    pointer-events: none;

}


/* ==============================
   TEXTO
   ============================== */

.texto-boton {

    position: relative;
    z-index: 2;

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-size: clamp(
        18px,
        3.8vh,
        36px
    );

    font-weight: 900;

    letter-spacing: 1.4px;

    white-space: nowrap;

    color: #ffffff;

    /*
       Animación continua.
       CSS puro: funciona también
       en móvil.
    */

    -webkit-animation:
        luminoso 0.65s
        infinite
        alternate
        ease-in-out;

    animation:
        luminoso 0.65s
        infinite
        alternate
        ease-in-out;

}


/* ==============================
   PARPADEO / ILUMINACIÓN
   ============================== */

@-webkit-keyframes luminoso {

    0% {

        color: #ffffff;

        -webkit-transform: scale(1);
        transform: scale(1);

        text-shadow:
            2px 2px 0 #790000;

    }

    100% {

        color: #ffe600;

        -webkit-transform: scale(1.07);
        transform: scale(1.07);

        text-shadow:

            0 0 4px #ffffff,

            0 0 9px #fff200,

            0 0 16px #ffe000,

            0 0 25px #ff9d00,

            2px 2px 0 #790000;

    }

}


@keyframes luminoso {

    0% {

        color: #ffffff;

        transform: scale(1);

        text-shadow:
            2px 2px 0 #790000;

    }

    100% {

        color: #ffe600;

        transform: scale(1.07);

        text-shadow:

            0 0 4px #ffffff,

            0 0 9px #fff200,

            0 0 16px #ffe000,

            0 0 25px #ff9d00,

            2px 2px 0 #790000;

    }

}


/* ==============================
   AL TOCAR EL BOTÓN
   ============================== */

.boton-peticion:active {

    transform: scale(.97);

}


/* ==============================
   MÓVILES PEQUEÑOS
   ============================== */

@media (max-width: 400px) {

    .boton-peticion {

        border-width: 3px;

        outline-width: 2px;

    }

    .boton-peticion::before {

        top: 4px;
        right: 4px;
        bottom: 4px;
        left: 4px;

        border-width: 1.5px;

    }

    .texto-boton {

        font-size: clamp(
            17px,
            3.5vh,
            29px
        );

    }

}


/* ==============================
   MÓVIL EN HORIZONTAL
   ============================== */

@media (orientation: landscape) {

    .cartel {

        height: 100vh;
        height: 100dvh;

        max-width: 100vw;

    }

}

</style>
</head>


<body>


<main class="cartel">


    <a
        class="boton-peticion"

        href="https://rekwest.app/qr/c3389356-bab1-475f-a781-38c8469c9a22"

        aria-label="Pedir mi canción"
    >

        <span class="texto-boton">
            PEDIR MI CANCIÓN
        </span>

    </a>


</main>


</body>
</html>
